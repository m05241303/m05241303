name: Atualizar animação de contribuições

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/contributions.yml"

permissions:
  contents: write

concurrency:
  group: profile-contribution-animation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs do gráfico
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: m05241303
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%237E22CE&color_dots=%23ebedf0,%23d9f99d,%23a3e635,%2365a30d,%234d7c0f
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23A855F7&color_dots=%23161b22,%233b1d5a,%236b21a8,%2384cc16,%23a3e635

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
